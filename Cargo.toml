[package]
name = "aikeeper"
version = "0.1.0"
edition = "2021"
description = "Panda Financial's A.I Keeper: watches the live keeper, Base and the market, forecasts, shadows every width decision and grades itself. It cannot sign or send anything."
license = "UNLICENSED"
publish = false

[[bin]]
name = "aikeeper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
